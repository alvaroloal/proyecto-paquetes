<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{header :: title}">
</head>

<body id="top">
    <header th:replace="header :: header"></header>

    <main>
        <article>
            <section class="section hero" aria-label="user-details" id="user-details"
                th:style="'background-image: url(' + @{/img/hero-banner.jpg} + ')'">
                <div class="container">
                    <div class="hero-content">
                        <h2 class="h1 hero-title">
                            <span class="span">Detalles del Usuario</span>
                        </h2>
                    </div>
                </div>
            </section>

            <section class="section user-details" id="user-details" aria-label="user-details">
                <div class="container" style="max-width: 700px; margin: 0 auto;">
                    <div
                        style="background: #fff; border-radius: 1.5rem; box-shadow: 0 8px 32px rgba(32,56,100,0.10); padding: 2.5rem 2rem;">
                        <h2 class="h2 section-title" style="text-align:center; margin-bottom: 2rem;">Editar usuario</h2>
                        <form th:action="@{/users/{username}/edit(username=${user.username})}" th:object="${user}"
                            method="post">
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem;">
                                <div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="username" style="font-weight: 600; margin-bottom: 0.5rem;">Nombre de
                                            usuario</label>
                                        <input type="text" id="username" name="username" th:field="*{username}"
                                            readonly="readonly" class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="password"
                                            style="font-weight: 600; margin-bottom: 0.5rem;">Contraseña</label>
                                        <input type="text" id="password" name="password" th:field="*{password}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="email" style="font-weight: 600; margin-bottom: 0.5rem;">Correo
                                            electrónico</label>
                                        <input type="email" id="email" name="email" th:field="*{address.email}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="firstName" style="font-weight: 600; margin-bottom: 0.5rem;">Primer
                                            apellido</label>
                                        <input type="text" id="firstName" name="firstName"
                                            th:field="*{address.firstName}" class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                </div>
                                <div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="lastName" style="font-weight: 600; margin-bottom: 0.5rem;">Segundo
                                            apellido</label>
                                        <input type="text" id="lastName" name="lastName" th:field="*{address.lastName}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="street"
                                            style="font-weight: 600; margin-bottom: 0.5rem;">Calle</label>
                                        <input type="text" id="street" name="street" th:field="*{address.street}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="city"
                                            style="font-weight: 600; margin-bottom: 0.5rem;">Ciudad</label>
                                        <input type="text" id="city" name="city" th:field="*{address.city}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="zipCode" style="font-weight: 600; margin-bottom: 0.5rem;">Código
                                            postal</label>
                                        <input type="text" id="zipCode" name="zipCode" th:field="*{address.zipCode}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                    <div class="form-group"
                                        style="flex-direction: column; align-items: flex-start; margin-bottom: 1rem;">
                                        <label for="country"
                                            style="font-weight: 600; margin-bottom: 0.5rem;">País</label>
                                        <input type="text" id="country" name="country" th:field="*{address.country}"
                                            class="form-control"
                                            style="padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; width: 100%; font-size: 1.2rem;" />
                                    </div>
                                </div>
                            </div>
                            <div class="button-container" style="justify-content: center;">
                                <button type="submit" class="btn-outline"
                                    style="width: 100%; padding: 1rem 0; font-size: 1.5rem; border-radius: 0.7rem;">Guardar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </article>
    </main>

    <footer th:replace="footer :: footer"></footer>

    <a href="#top" class="back-top-btn" aria-label="Back to top" data-back-top-btn>
        <ion-icon name="chevron-up"></ion-icon>
    </a>
    <script src="./js/script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>
</body>

</html>
