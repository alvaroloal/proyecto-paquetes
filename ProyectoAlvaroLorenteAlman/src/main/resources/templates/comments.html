<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head th:replace="~{header :: title}">
</head>

<body id="top">
    <header th:replace="header :: header"></header>

    <main>
        <article>
            <section class="section hero" aria-label="home" id="home"
                th:style="'background-image: url(' + @{/img/hero-banner.jpg} + ')'">
                <div class="container">
                    <div class="hero-content">
                        <h2 class="h1 hero-title">
                            <span class="span">Valoraciones</span>
                        </h2>
                    </div>
                </div>
            </section>

            <section class="section comments" id="comments" aria-label="comments">
                <div class="container" style="max-width: 900px; margin: 0 auto;">
                    <div
                        style="background: #fff; border-radius: 1.5rem; box-shadow: 0 8px 32px rgba(32,56,100,0.10); padding: 2.5rem 2rem; margin-bottom: 2rem;">
                        <div th:if="${username != null}">
                            <h2 class="h2 section-title" style="text-align:center; margin-bottom: 2rem;">Cuéntale a
                                otros clientes tu experiencia, <span th:text="${username}">Usuario.</span></h2>
                            <form th:action="@{/comments/create}" th:object="${newComment}" method="post"
                                style="display: flex; flex-direction: column; gap: 1.5rem; align-items: center;">
                                <div
                                    style="display: flex; flex-direction: column; align-items: center; gap: 0.5rem; width: 100%;">
                                    <label for="rating" style="font-weight: 600;">Valoración</label>
                                    <input type="number" name="rating" th:field="*{rating}"
                                        placeholder="Valoración (1-5)" min="1" max="5" required
                                        style="width: 120px; padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; font-size: 1.2rem; text-align: center;" />
                                </div>
                                <div style="width: 100%;">
                                    <label for="description"
                                        style="font-weight: 600; margin-bottom: 0.5rem;">Comentario</label>
                                    <textarea name="description" th:field="*{description}"
                                        placeholder="Escribe tu comentario" required class="custom-textarea"
                                        style="width: 100%; min-height: 120px; padding: 0.7rem; border-radius: 0.7rem; border: 1px solid #dbeafe; background: #f3f6fa; font-size: 1.2rem;"></textarea>
                                </div>
                                <button type="submit" class="btn-outline"
                                    style="width: 100%; padding: 1rem 0; font-size: 1.3rem; border-radius: 0.7rem;">Publicar</button>
                            </form>
                        </div>
                        <div th:if="${username == null}">
                            <h2 class="h2 section-title" style="text-align:center; margin-bottom: 2rem;">Qué opinan de
                                nosotros</h2>
                        </div>
                    </div>
                    <div
                        style="background: #fff; border-radius: 1.5rem; box-shadow: 0 8px 32px rgba(32,56,100,0.10); padding: 2.5rem 2rem;">
                        <h2 class="h2 section-title" style="text-align:center; margin-bottom: 2rem;">Comentarios de
                            clientes</h2>
                        <div style="overflow-x:auto;">
                            <table class="table" style="background: #f9f9f9; border-radius: 1rem; overflow: hidden;">
                                <thead>
                                    <tr style="background: #e3f0ff;">
                                        <th>Usuario</th>
                                        <th>Fecha</th>
                                        <th>Valoración</th>
                                        <th>Descripción</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="comment : ${comments}">
                                        <td th:text="${comment.user.username}"></td>
                                        <td th:text="${#dates.format(comment.date, 'yyyy-MM-dd')}"></td>
                                        <td>
                                            <span th:utext="${'★'.repeat(comment.rating)}"
                                                style="color: #f5b301; font-size: 1.3rem;"></span>
                                            <span th:if="${comment.rating < 5}"
                                                th:utext="${'☆'.repeat(5 - comment.rating)}"
                                                style="color: #dbeafe; font-size: 1.3rem;"></span>
                                        </td>
                                        <td th:text="${comment.description}"></td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </section>
        </article>
    </main>

    <footer th:replace="footer :: footer"></footer>

    <a href="#top" class="back-top-btn" aria-label="Volver arriba" data-back-top-btn>
        <ion-icon name="chevron-up"></ion-icon>
    </a>
    <script src="./js/script.js" defer></script>
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>

</html>
